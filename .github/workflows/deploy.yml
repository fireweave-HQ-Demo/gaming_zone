name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy prod
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 20s
          command_timeout: 2m
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL,OPENOBSERVE_URL,OPENOBSERVE_USER,OPENOBSERVE_PASSWORD
          script: |
            set -euo pipefail
            APP_DIR="$HOME/arcade"
            if [ ! -d "$APP_DIR/.git" ]; then
              # migrate from legacy temp-battle checkout if present
              if [ -d "$HOME/temp-battle/.git" ]; then
                mv "$HOME/temp-battle" "$APP_DIR"
                git -C "$APP_DIR" remote set-url origin https://github.com/fireweave-HQ-Demo/gaming_zone.git
              else
                git clone --depth=1 https://github.com/fireweave-HQ-Demo/gaming_zone.git "$APP_DIR"
              fi
            fi
            cd "$APP_DIR"
            git remote set-url origin https://github.com/fireweave-HQ-Demo/gaming_zone.git
            git fetch --depth=1 origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh scripts/prod-start.sh scripts/prod-stop.sh scripts/dev.sh scripts/dev-stop.sh
            ./scripts/deploy-prod.sh
