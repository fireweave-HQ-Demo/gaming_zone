# Hot-reload stack: repo bind-mounted; API uses polling restart (Docker Desktop / macOS).
# Nested node_modules are anonymous volumes so host Bun links don't break Linux installs.
# Vite uses CHOKIDAR polling for HMR. Start: bun start:docker
name: arcade-dev

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tictac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tictac}
      POSTGRES_DB: ${POSTGRES_DB:-tictac}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tictac}"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    image: oven/bun:1.2-alpine
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun scripts/docker-api-watch.ts"
    volumes:
      - ..:/app
      - arcade_api_nm:/app/node_modules
      # hide host workspace links (point at Darwin/.bun paths)
      - arcade_api_pkg_nm:/app/apps/api/node_modules
      - arcade_api_web_nm:/app/apps/web/node_modules
      - arcade_api_shared_nm:/app/packages/shared/node_modules
      - arcade_api_core_nm:/app/packages/game-core/node_modules
      - arcade_api_engines_nm:/app/packages/engines/node_modules
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      WEB_DEV_ORIGIN: http://localhost:5173
      DOCKER_WATCH_INTERVAL_MS: "400"
      DATABASE_URL: postgres://${POSTGRES_USER:-tictac}:${POSTGRES_PASSWORD:-tictac}@db:5432/${POSTGRES_DB:-tictac}
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-}
      OPENOBSERVE_LOG_STREAM: ${OPENOBSERVE_LOG_STREAM:-arcade_logs}
      OPENOBSERVE_TRACE_STREAM: ${OPENOBSERVE_TRACE_STREAM:-arcade_traces}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: oven/bun:1.2-alpine
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && cd apps/web && bunx vite --host 0.0.0.0 --port 5173"
    volumes:
      - ..:/app
      - arcade_web_nm:/app/node_modules
      - arcade_web_api_nm:/app/apps/api/node_modules
      - arcade_web_pkg_nm:/app/apps/web/node_modules
      - arcade_web_shared_nm:/app/packages/shared/node_modules
      - arcade_web_core_nm:/app/packages/game-core/node_modules
      - arcade_web_engines_nm:/app/packages/engines/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      API_PROXY: http://api:3000
    depends_on:
      - api

volumes:
  pgdata_dev:
  arcade_api_nm:
  arcade_api_pkg_nm:
  arcade_api_web_nm:
  arcade_api_shared_nm:
  arcade_api_core_nm:
  arcade_api_engines_nm:
  arcade_web_nm:
  arcade_web_api_nm:
  arcade_web_pkg_nm:
  arcade_web_shared_nm:
  arcade_web_core_nm:
  arcade_web_engines_nm:
