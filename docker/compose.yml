# Local development — Postgres only (+ optional baked app via profile "docker")
name: arcade

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tictac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tictac}
      POSTGRES_DB: ${POSTGRES_DB:-tictac}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tictac}"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  # Optional: baked container (no live reload). Use: bun start:docker:baked
  app:
    profiles: ["docker"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-tictac}:${POSTGRES_PASSWORD:-tictac}@db:5432/${POSTGRES_DB:-tictac}
      PORT: "3000"
      OPENOBSERVE_URL: ${OPENOBSERVE_URL}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD}
      OPENOBSERVE_LOG_STREAM: ${OPENOBSERVE_LOG_STREAM:-arcade_logs}
      OPENOBSERVE_TRACE_STREAM: ${OPENOBSERVE_TRACE_STREAM:-arcade_traces}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
